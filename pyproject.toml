[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pepworld-intelligence"
version = "0.1.0"
description = "Reusable, traceable, evidence-aware Python contracts for PEPWORLD Intelligence System V1."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "PEPWORLD" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/pepworldOFFICIAL/plaveo-intelligence-"
Repository = "https://github.com/pepworldOFFICIAL/plaveo-intelligence-"
Issues = "https://github.com/pepworldOFFICIAL/plaveo-intelligence-/issues"

[tool.setuptools.packages.find]
include = ["pepworld_intelligence*"]
